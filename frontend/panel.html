<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tsukumo - pannello</title>
    <link rel="stylesheet" href="./src/panel.css" />
  </head>
  <body>
    <div class="app">
      <!-- Barra del titolo: trascinandola il pannello si stacca dal personaggio -->
      <header class="titlebar">
        <div class="identity">
          <div id="badge" class="avatar-badge" data-state="unknown" aria-hidden="true">
            <span class="badge-ring"></span>
            <span class="badge-letter">T</span>
          </div>
          <div class="titles">
            <strong>Tsukumo</strong>
            <span id="agent-line" class="subtitle">Connessione…</span>
          </div>
        </div>
        <div class="window-actions" id="window-actions"></div>
      </header>

      <nav class="tabs" role="tablist" id="tabs"></nav>

      <div id="now-playing" class="now-playing hidden" title="In riproduzione su Spotify">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <span id="now-playing-text" class="now-playing-text"></span>
      </div>

      <main class="views">
        <!-- Chat ------------------------------------------------------------>
        <section id="view-chat" class="view chat-view" role="tabpanel">
          <div class="chat-toolbar">
            <button id="engine-chip" class="engine-chip" type="button" title="Cambia cervello">
              <span class="dot" data-state="unknown"></span>
              <span id="engine-chip-text">…</span>
            </button>
            <span class="spacer"></span>
            <button id="btn-screen" class="ghost-btn hidden" type="button" title="Falle vedere lo schermo"></button>
            <button id="btn-new-chat" class="ghost-btn" type="button" title="Dimentica la conversazione e ricomincia"></button>
          </div>
          <div id="messages" class="messages" aria-live="polite"></div>
          <div class="composer-wrap">
            <div id="typing" class="typing hidden"><i></i><i></i><i></i><span>sta pensando</span></div>
            <div id="attachments" class="attachments hidden"></div>
            <input id="file-input" type="file" multiple hidden />
            <form id="composer" class="composer" autocomplete="off">
              <button id="btn-mic" class="composer-icon" type="button" title="Parla (Ctrl+Spazio)"></button>
              <button id="btn-attach" class="composer-icon" type="button" title="Allega un file (o trascinalo qui, o su di lei)"></button>
              <textarea id="input" rows="1" placeholder="Scrivile qualcosa…" aria-label="Messaggio"></textarea>
              <button id="btn-read" class="composer-icon" type="button" title="Fai solo leggere il testo, senza passare dal cervello"></button>
              <button id="btn-send" class="send" type="submit" title="Invia (Invio)"></button>
            </form>
          </div>
        </section>

        <!-- Personaggio ----------------------------------------------------->
        <section id="view-character" class="view scroll" role="tabpanel"></section>

        <!-- Agenda: timer, promemoria, sveglie, azioni programmate ---------->
        <section id="view-agenda" class="view scroll" role="tabpanel"></section>

        <!-- Lavoro: consumi e avvisi degli agenti usati per conto tuo ------>
        <section id="view-work" class="view scroll" role="tabpanel"></section>

        <!-- Motori: disegnati leggendo GET /api/providers ------------------->
        <section id="view-engines" class="view scroll" role="tabpanel"></section>
      </main>
    </div>

    <script type="module" src="./src/panel.js"></script>
  </body>
</html>
