<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tsukumo - panel</title>
    <link rel="stylesheet" href="./src/panel.css" />
  </head>
  <body>
    <div class="app">
      <!-- Title bar: dragging it detaches the panel from the character -->
      <header class="titlebar">
        <div class="identity">
          <div id="badge" class="avatar-badge" data-state="unknown" aria-hidden="true">
            <span class="badge-ring"></span>
            <span class="badge-letter">T</span>
          </div>
          <div class="titles">
            <strong>Tsukumo</strong>
            <span id="agent-line" class="subtitle" data-i18n>Connecting…</span>
          </div>
        </div>
        <div class="window-actions" id="window-actions"></div>
      </header>

      <nav class="tabs" role="tablist" id="tabs"></nav>

      <div id="now-playing" class="now-playing hidden" title="Playing on Spotify" data-i18n-attrs="title">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <span id="now-playing-text" class="now-playing-text"></span>
      </div>

      <main class="views">
        <!-- Chat ------------------------------------------------------------>
        <section id="view-chat" class="view chat-view" role="tabpanel">
          <div class="chat-toolbar">
            <button id="engine-chip" class="engine-chip" type="button" title="Change brain" data-i18n-attrs="title">
              <span class="dot" data-state="unknown"></span>
              <span id="engine-chip-text">…</span>
            </button>
            <span class="spacer"></span>
            <button id="btn-screen" class="ghost-btn hidden" type="button" title="Show her the screen" data-i18n-attrs="title"></button>
            <button id="btn-new-chat" class="ghost-btn" type="button" title="Forget the conversation and start over" data-i18n-attrs="title"></button>
          </div>
          <div id="messages" class="messages" aria-live="polite"></div>
          <div class="composer-wrap">
            <div id="typing" class="typing hidden"><i></i><i></i><i></i><span data-i18n>thinking</span></div>
            <div id="attachments" class="attachments hidden"></div>
            <input id="file-input" type="file" multiple hidden />
            <form id="composer" class="composer" autocomplete="off">
              <button id="btn-mic" class="composer-icon" type="button" title="Talk (Ctrl+Space)" data-i18n-attrs="title"></button>
              <button id="btn-attach" class="composer-icon" type="button" title="Attach a file (or drop it here, or on her)" data-i18n-attrs="title"></button>
              <textarea id="input" rows="1" placeholder="Write her something…" aria-label="Message" data-i18n-attrs="placeholder,aria-label"></textarea>
              <button id="btn-read" class="composer-icon" type="button" title="Just have the text read aloud, without the brain" data-i18n-attrs="title"></button>
              <button id="btn-send" class="send" type="submit" title="Send (Enter)" data-i18n-attrs="title"></button>
            </form>
          </div>
        </section>

        <!-- Character -------------------------------------------------------->
        <section id="view-character" class="view scroll" role="tabpanel"></section>

        <!-- Agenda: timers, reminders, alarms, scheduled actions -------------->
        <section id="view-agenda" class="view scroll" role="tabpanel"></section>


        <!-- Work: usage and notifications of the agents you use on your own --->
        <section id="view-work" class="view scroll" role="tabpanel"></section>

        <!-- Engines: drawn by reading GET /api/providers --------------------->
        <section id="view-engines" class="view scroll" role="tabpanel"></section>
      </main>
    </div>

    <script type="module" src="./src/panel.js"></script>
  </body>
</html>
