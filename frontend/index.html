<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tsukumo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23a58bff'/></svg>" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- The flame's island (right-click): BEFORE the canvas, so she is drawn on top of it -->
    <div id="island" aria-label="Tsukumo menu" data-i18n-attrs="aria-label"></div>

    <!-- The character. Everything else appears only when needed. -->
    <canvas id="stage"></canvas>

    <!-- The arc docks beside the 3D body: right-click to open them -->
    <div id="hud" aria-label="Tsukumo commands" data-i18n-attrs="aria-label"></div>

    <!-- What she's saying, above her head -->
    <div id="bubble" class="bubble hidden" aria-live="polite"></div>
    <div id="zzz" class="zzz hidden" aria-hidden="true"><span>z</span><span>z</span><span>Z</span></div>

    <!-- Passing system messages -->
    <div id="toast" class="toast hidden" aria-live="polite" data-solid></div>

    <!-- Browser only: in the desktop window you write in the panel -->
    <form id="composer" class="composer hidden" autocomplete="off" data-solid>
      <input id="input" class="input" type="text" placeholder="Write her something…" aria-label="Message" data-i18n-attrs="placeholder,aria-label" />
      <button id="btn-send" class="composer-send" type="submit" title="Send (Enter)" aria-label="Send" data-i18n-attrs="title,aria-label"></button>
    </form>

    <input id="file-vrm" type="file" accept=".vrm" hidden />

    <!-- Loading and blocking problems -->
    <div id="overlay" class="overlay" data-solid>
      <div class="overlay-card">
        <div class="spinner"></div>
        <p id="overlay-text" data-i18n>Tsukumo is waking up…</p>
        <p id="overlay-hint" class="overlay-hint"></p>
      </div>
    </div>

    <!-- Lip-sync debug panel -->
    <div id="debug" class="debug hidden" data-solid>
      <div class="debug-row"><span>viseme</span><b id="dbg-viseme">sil</b></div>
      <div class="debug-row"><span>rms</span><b id="dbg-rms">0.00</b></div>
      <div class="debug-row"><span>fps</span><b id="dbg-fps">0</b></div>
      <div class="debug-row"><span>driver</span><b id="dbg-driver">-</b></div>
      <div class="debug-bars">
        <div class="bar"><i data-viseme="a"></i><span>A</span></div>
        <div class="bar"><i data-viseme="i"></i><span>I</span></div>
        <div class="bar"><i data-viseme="u"></i><span>U</span></div>
        <div class="bar"><i data-viseme="e"></i><span>E</span></div>
        <div class="bar"><i data-viseme="o"></i><span>O</span></div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
