<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tsukumo</title>
    <link rel="stylesheet" href="./src/panel.css" />
    <link rel="stylesheet" href="./src/dashboard.css" />
  </head>
  <body class="dashboard">
    <div class="dash">
      <!-- Her side: who she is, and every section of the app. -->
      <nav class="dash-rail" aria-label="Sections" data-i18n-attrs="aria-label">
        <div class="rail-brand">
          <span class="dash-logo" aria-hidden="true"></span>
          <div class="rail-who">
            <strong id="her-name">Tsukumo</strong>
            <span id="her-state" class="rail-state" data-state="unknown"></span>
          </div>
        </div>
        <div id="rail-nav" class="rail-nav" role="tablist"></div>
        <span class="spacer"></span>
        <div id="now-playing" class="now-playing hidden" title="Playing on Spotify" data-i18n-attrs="title">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
          <span id="now-playing-text" class="now-playing-text"></span>
        </div>
        <div id="rail-foot" class="rail-foot"></div>
      </nav>

      <div class="dash-main">
        <!-- The window is dragged from here. "−" minimizes it: the companion goes back to the desktop. -->
        <header class="dash-header">
          <div class="dash-title">
            <strong id="page-title" data-i18n>Hi</strong>
            <span id="page-sub" class="subtitle"></span>
          </div>
          <span class="spacer"></span>
          <div class="dash-actions" id="dash-actions"></div>
        </header>

        <div class="dash-pages">
          <main class="dash-grid dash-page" id="dash-grid"></main>
          <section id="view-agenda" class="view scroll dash-page flow hidden" role="tabpanel"></section>
          <section id="view-work" class="view scroll dash-page flow hidden" role="tabpanel"></section>
          <section id="view-character" class="view scroll dash-page flow hidden" role="tabpanel"></section>
          <section id="view-engines" class="view scroll dash-page hidden" role="tabpanel"></section>
        </div>
      </div>

      <!-- The chat (the panel's own) and, above the text field, her corner. -->
      <aside class="dash-side">
        <section id="view-chat" class="view chat-view">
          <div class="chat-toolbar">
            <button id="engine-chip" class="engine-chip" type="button" title="Change brain" data-i18n-attrs="title">
              <span class="dot" data-state="unknown"></span>
              <span id="engine-chip-text">…</span>
            </button>
            <span class="spacer"></span>
            <button id="btn-screen" class="ghost-btn hidden" type="button" title="Show her the screen" data-i18n-attrs="title"></button>
            <button id="btn-new-chat" class="ghost-btn" type="button" title="Forget the conversation and start over" data-i18n-attrs="title"></button>
          </div>
          <div id="messages" class="messages" aria-live="polite"></div>
          <div id="stage" class="stage">
            <div id="stage-bubble" class="stage-bubble"></div>
          </div>
          <div class="composer-wrap">
            <div id="typing" class="typing hidden"><i></i><i></i><i></i><span data-i18n>thinking</span></div>
            <div id="attachments" class="attachments hidden"></div>
            <input id="file-input" type="file" multiple hidden />
            <form id="composer" class="composer" autocomplete="off">
              <button id="btn-mic" class="composer-icon" type="button" title="Talk (Ctrl+Space)" data-i18n-attrs="title"></button>
              <button id="btn-attach" class="composer-icon" type="button" title="Attach a file (or drop it here)" data-i18n-attrs="title"></button>
              <textarea id="input" rows="1" placeholder="Write her something…" aria-label="Message" data-i18n-attrs="placeholder,aria-label"></textarea>
              <button id="btn-read" class="composer-icon" type="button" title="Just have the text read aloud, without the brain" data-i18n-attrs="title"></button>
              <button id="btn-send" class="send" type="submit" title="Send (Enter)" data-i18n-attrs="title"></button>
            </form>
          </div>
        </section>
      </aside>
    </div>

    <script type="module" src="./src/dashboard.js"></script>
  </body>
</html>
