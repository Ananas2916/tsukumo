<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tsukumo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23a58bff'/></svg>" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Il personaggio. Tutto il resto compare solo quando serve. -->
    <canvas id="stage"></canvas>

    <!-- I dock ad arco ai suoi lati: tasto destro per aprirli -->
    <div id="hud" aria-label="Comandi di Tsukumo"></div>

    <!-- Quello che sta dicendo, sopra la testa -->
    <div id="bubble" class="bubble hidden" aria-live="polite"></div>

    <!-- Messaggi di sistema, passeggeri -->
    <div id="toast" class="toast hidden" aria-live="polite" data-solid></div>

    <!-- Solo nel browser: nella finestra desktop si scrive nel pannello -->
    <form id="composer" class="composer hidden" autocomplete="off" data-solid>
      <input id="input" class="input" type="text" placeholder="Scrivile qualcosa..." aria-label="Messaggio" />
      <button id="btn-send" class="composer-send" type="submit" title="Invia (Invio)" aria-label="Invia"></button>
    </form>
    <input id="file-vrm" type="file" accept=".vrm" hidden />

    <!-- Caricamento e problemi bloccanti -->
    <div id="overlay" class="overlay" data-solid>
      <div class="overlay-card">
        <div class="spinner"></div>
        <p id="overlay-text">Tsukumo si sta svegliando…</p>
        <p id="overlay-hint" class="overlay-hint"></p>
      </div>
    </div>

    <!-- Pannello di debug del lip-sync -->
    <div id="debug" class="debug hidden" data-solid>
      <div class="debug-row"><span>viseme</span><b id="dbg-viseme">sil</b></div>
      <div class="debug-row"><span>rms</span><b id="dbg-rms">0.00</b></div>
      <div class="debug-row"><span>fps</span><b id="dbg-fps">0</b></div>
      <div class="debug-row"><span>driver</span><b id="dbg-driver">-</b></div>
      <div class="debug-bars">
        <div class="bar"><i data-viseme="a"></i><span>A</span></div>
        <div class="bar"><i data-viseme="i"></i><span>I</span></div>
        <div class="bar"><i data-viseme="u"></i><span>U</span></div>
        <div class="bar"><i data-viseme="e"></i><span>E</span></div>
        <div class="bar"><i data-viseme="o"></i><span>O</span></div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
